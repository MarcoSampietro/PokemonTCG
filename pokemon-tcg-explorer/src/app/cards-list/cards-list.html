<div class="cards-page">
  <section class="filters">
    <input
      type="text"
      placeholder="Cerca per nome..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
    />

    <select [(ngModel)]="selectedSetId" (change)="onFilterChange()">
      <option value="">Tutti i set</option>
      <option *ngFor="let set of sets" [value]="set.id">
        {{ set.name }}
      </option>
    </select>

    <select [(ngModel)]="selectedType" (change)="onFilterChange()">
      <option value="">Tutti i tipi</option>
      <option *ngFor="let t of types" [value]="t">{{ t }}</option>
    </select>

    <select [(ngModel)]="selectedRarity" (change)="onFilterChange()">
      <option value="">Tutte le rarità</option>
      <option *ngFor="let r of rarities" [value]="r">{{ r }}</option>
    </select>
  </section>

  <section *ngIf="loading" class="status">
    Caricamento carte...
  </section>

  <section *ngIf="errorMessage" class="status error">
    {{ errorMessage }}
  </section>

  <section *ngIf="!loading && !errorMessage && cards.length === 0" class="status">
    Nessuna carta trovata con i filtri attuali.
  </section>

  <section class="cards-grid" *ngIf="cards.length > 0">
    <article class="card-item" *ngFor="let card of cards">
      <a [routerLink]="['/cards', card.id]">
        <img
          [src]="card.images?.small"
          [alt]="card.name"
        />
        <h3>{{ card.name }}</h3>
        <p *ngIf="card.hp">HP: {{ card.hp }}</p>
        <p *ngIf="card.rarity">Rarità: {{ card.rarity }}</p>
        <p *ngIf="card.set?.name">Set: {{ card.set?.name }}</p>
      </a>
    </article>
  </section>

  <section class="pagination" *ngIf="totalCount > pageSize">
    <button (click)="goToPage(-1)" [disabled]="page === 1">
      ‹ Precedente
    </button>
    <span>Pagina {{ page }} di {{ (totalCount / pageSize) | number:'1.0-0' }}</span>
    <button (click)="goToPage(1)" [disabled]="page * pageSize >= totalCount">
      Successiva ›
    </button>
  </section>
</div>
